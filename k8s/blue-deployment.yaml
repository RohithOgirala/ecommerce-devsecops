apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopeasy-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopeasy
      version: blue
  template:
    metadata:
      labels:
        app: shopeasy
        version: blue
    spec:
      containers:
      - name: shopeasy
        image: shopeasy-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 80
